# Nginx de la LXC de la web CV: sirve WEB_ROOT/current (enlace a releases/<versión>).
# Se instala como /etc/nginx/sites-available/web-cv (deploy/README.md, paso 4).
#
# Delante están Cloudflare y Nginx Proxy Manager (NPM): el TLS y HSTS terminan allí, así que aquí
# se escucha HTTP en la red interna. Marcadores (no se versionan valores reales):
#   <IP_NPM>   IP de Nginx Proxy Manager, para que los logs muestren la IP real del visitante
#   /srv/web-cv  WEB_ROOT por defecto (si se cambia, cambiarlo también en web-cv-update.service)
#
# Requiere Nginx >= 1.19 (Debian 12 trae 1.22). No hay que recargar Nginx al desplegar: el enlace
# current se resuelve en cada petición (open_file_cache está desactivado por defecto; no activarlo).

# Caché por tipo de contenido. `expires` (y no add_header) para no anular las cabeceras de
# seguridad del bloque server: add_header en un location descarta las heredadas.
#   HTML: no-cache (siempre se revalida con ETag/Last-Modified; un despliegue se ve al momento).
#   CSS/JS: 1 h. Sus nombres no llevan hash (styles.css, main.js): un caché largo serviría CSS viejo
#     con HTML nuevo durante días. Si el build añade hash al nombre, subir a 1 año + immutable.
#   Imágenes, iconos y fuentes: 7 días (cambian muy poco; si se cambia la foto, cambiarle el nombre).
map $sent_http_content_type $web_cv_expires {
    default                     off;
    ~*^text/html                epoch;
    ~*^text/css                 1h;
    ~*^(application|text)/javascript  1h;
    ~*^image/                   7d;
    ~*^font/                    7d;
    ~*^application/manifest     1d;
    ~*^text/plain               1h;
    ~*^application/xml          1h;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /srv/web-cv/current;
    index index.html;

    charset utf-8;
    charset_types text/css text/plain text/xml application/javascript application/json
                  application/manifest+json image/svg+xml;

    server_tokens off;
    # Detrás de un proxy, las redirecciones (/es → /es/) deben ser relativas: si no, Nginx pondría
    # en Location su propio esquema y puerto internos (http://…:80/es/).
    absolute_redirect off;

    # IP real del visitante en los logs (descomentar con la IP de NPM):
    # set_real_ip_from <IP_NPM>;
    # real_ip_header X-Forwarded-For;

    expires $web_cv_expires;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/css text/plain text/xml application/javascript application/json
               application/manifest+json application/xml image/svg+xml;

    # --- Cabeceras de seguridad (sitio estático, sin JS ni recursos de terceros) -------------------
    # CSP: solo recursos propios. El único JS en línea (src/scripts/head.js, el que fija el tema antes
    # de pintar) se autoriza por su hash sha256; `node deploy/check-csp.mjs dist` lo calcula y CI falla
    # si el hash de aquí no coincide con el del HTML generado. Por qué hash y no nonce: deploy/README.md.
    # style-src-attr 'unsafe-inline': el diagrama usa style="--n:…" (variables CSS para escalonar la
    # animación); no ejecuta nada. Si se pasan a clases, quitarlo.
    # Los datos estructurados (<script type="application/ld+json">) no se ejecutan y la CSP no los bloquea.
    # 'unsafe-hashes' + 'sha256-DPWv…': el onerror="…" de la foto del hero (si falla el recorte, carga
    # foto.jpg). Solo autoriza ese manejador exacto; si se pasa a main.js, se quitan ambos.
    # <HASH_HEAD_JS>: sustituir por el hash que imprime check-csp cuando exista src/scripts/head.js.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'sha256-<HASH_HEAD_JS>' 'unsafe-hashes' 'sha256-DPWv8KN5SHzUgAQfcVQrFiPhYICl90yZPWFfCLIDu70='; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; manifest-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # HSTS va en el borde (NPM o Cloudflare), que es donde hay HTTPS; aquí no tendría efecto.

    location / {
        try_files $uri $uri/ =404;
    }

    # Página 404 propia si el release la trae (dist/404.html); si no, Nginx usa la suya.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Nada de ficheros ocultos (el enlace current.tmp, .update.lock…, aunque viven fuera de root).
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # URL de la web actual que ya están indexadas (ARCHITECTURE.md, SEO medida 8): redirigirlas en
    # vez de dar 404. Completar en la fase 6 con las rutas reales de la web antigua, por ejemplo:
    # location = /<RUTA_ANTIGUA>.html { return 301 /es/; }

    access_log /var/log/nginx/web-cv.access.log;
    error_log  /var/log/nginx/web-cv.error.log warn;
}
