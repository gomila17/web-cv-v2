<!doctype html>
<!--
  Fuente de linkedin-banner.png (portada de LinkedIn, 1584×396). No se publica en la web: solo se sube a LinkedIn.
  Fondo del modo oscuro (tokens.css): degradado #0d1117 → #141a35 → #221640, rejilla, manchas y red de nodos del hero.
  La zona izquierda queda libre porque la foto de perfil de LinkedIn tapa esa esquina; en móvil se recorta por los lados.
  Regenerar (desde la raíz del repo, en PowerShell):
    & "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe" --headless=new --disable-gpu --hide-scrollbars `
      --force-device-scale-factor=1 --window-size=1584,396 --user-data-dir="$env:TEMP\og-edge" `
      --screenshot="$PWD\src\og\linkedin-banner.png" "file:///$($PWD -replace '\\','/')/src/og/linkedin-banner.html"
-->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Portada de LinkedIn</title>
<style>
  :root {
    --bg: #0d1117; --text: #e6edf3; --muted: #9aa7bd; --accent: #58a6ff; --violet: #a78bfa;
    --sans: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono: ui-monospace, "Cascadia Code", "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1584px; height: 396px; overflow: hidden; }
  body { position: relative; font-family: var(--sans); color: var(--text); background: linear-gradient(135deg, #0d1117, #141a35 55%, #221640); }
  .grid {
    position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px);
    background-size: 34px 34px;
    -webkit-mask-image: radial-gradient(ellipse 55% 110% at 78% 40%, #000 0, transparent 75%);
            mask-image: radial-gradient(ellipse 55% 110% at 78% 40%, #000 0, transparent 75%);
  }
  .orb { position: absolute; border-radius: 50%; }
  .o1 { width: 620px; height: 620px; right: -140px; top: -260px; background: radial-gradient(circle, rgba(88,166,255,.22), transparent 68%); }
  .o2 { width: 520px; height: 520px; left: 120px; bottom: -330px; background: radial-gradient(circle, rgba(139,108,240,.26), transparent 68%); }
  .net { position: absolute; right: 90px; top: 40px; width: 380px; height: 322px; opacity: .9; }
  .band { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: linear-gradient(90deg, var(--accent), var(--violet)); }

  .text { position: absolute; left: 470px; top: 96px; }
  .mark { display: inline-block; font: 700 26px/1 var(--mono); padding-bottom: 7px; border-bottom: 4px solid var(--accent); letter-spacing: -.02em; }
  h1 { margin-top: 26px; font-size: 76px; line-height: 1; font-weight: 700; letter-spacing: -.03em; }
  .role { margin-top: 12px; font-size: 34px; font-weight: 600; color: var(--accent); letter-spacing: -.01em; }
  .stack { margin-top: 14px; font: 500 21px/1.3 var(--mono); color: var(--muted); }
  .url { position: absolute; right: 90px; bottom: 34px; font: 600 22px/1 var(--mono); color: var(--text); }
  .url span { color: var(--accent); }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="orb o1"></div>
  <div class="orb o2"></div>
  <svg class="net" viewBox="0 0 260 220" aria-hidden="true">
    <g stroke="#58a6ff" stroke-opacity=".6" stroke-width="1.2" fill="none">
      <path d="M20 30 L100 80 L190 40 L225 130 L110 160 L100 80"/><path d="M190 40 L245 10"/><path d="M110 160 L30 190"/>
    </g>
    <g fill="#58a6ff">
      <circle cx="20" cy="30" r="4"/><circle cx="100" cy="80" r="6" fill="#a78bfa"/><circle cx="190" cy="40" r="4"/>
      <circle cx="225" cy="130" r="5"/><circle cx="110" cy="160" r="4"/><circle cx="245" cy="10" r="3"/><circle cx="30" cy="190" r="3"/>
    </g>
  </svg>
  <div class="text">
    <span class="mark">tg</span>
    <h1>Toni Gomila</h1>
    <p class="role">Backend Developer</p>
    <p class="stack">Java · Spring · Oracle · Barcelona</p>
  </div>
  <p class="url">gomila<span>.dev</span></p>
  <div class="band"></div>
</body>
</html>
